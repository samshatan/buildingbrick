<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Building Your Home - Marketplace for Construction & Domestic Workers" />
    <link rel="apple-touch-icon" href="/logo.jpg" sizes="192x192" />
    
    <!-- Preconnect to font domains for faster LCP -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Prata&display=swap" rel="stylesheet">
    
    <title>BrickOurHouse</title>
  </head>
  <body>
    <div id="root">
      <style>
        .initial-loader-container {
          display: flex;
          align-items: center;
          justify-content: center;
          min-height: 100vh;
          background-color: #f5f3ff;
        }
        .initial-loader {
          width: 48px;
          height: 48px;
          border: 4px solid #ede9fe;
          border-bottom-color: #8b5cf6;
          border-radius: 50%;
          animation: rotation 1s linear infinite;
        }
        @keyframes rotation {
          0% { transform: rotate(0deg) }
          100% { transform: rotate(360deg) }
        }
      </style>
      <div class="initial-loader-container">
        <div class="initial-loader"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
